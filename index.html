<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body>
<title>Schede Coaching</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Layout: editor a sinistra (campi), anteprima A4 a destra; su telefono due schede. Le pagine A4 hanno colori fissi (sono il documento stampato). */
:root{
  --bg:#F3F1EE; --panel:#FFFFFF; --fg:#1B1C1F; --muted:#6C6A70; --line:#E3DFD9; --field:#FAF9F7;
  --accent:#E8541C; --accent-ink:#FFFFFF; --ok:#1E8A5C; --warn:#C23B22;
  --ui:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --doc:"Poppins",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121315; --panel:#1B1C1F; --fg:#EEECE8; --muted:#9A979F; --line:#2C2D31; --field:#141517;
  --accent:#FF6A33; --accent-ink:#111; --ok:#3DBB84; --warn:#FF6B55; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121315; --panel:#1B1C1F; --fg:#EEECE8; --muted:#9A979F; --line:#2C2D31; --field:#141517;
  --accent:#FF6A33; --accent-ink:#111; --ok:#3DBB84; --warn:#FF6B55; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--ui);font-size:14px;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--panel);border-bottom:1px solid var(--line);
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;align-items:center;gap:10px;flex-wrap:wrap}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--panel)}
.brand{font-weight:800;font-size:16px;letter-spacing:-.2px;margin-right:auto;display:flex;align-items:center;gap:8px}
.brand i{width:10px;height:10px;border-radius:3px;background:var(--accent);display:inline-block}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:8px 12px;font-weight:700;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.sm{padding:5px 9px;font-size:12px;border-radius:8px}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.danger{color:var(--warn)}
.btn[disabled]{opacity:.55;cursor:progress}
.tabs{display:none;gap:4px;background:var(--field);border:1px solid var(--line);border-radius:10px;padding:3px}
.tabs button{border:0;background:transparent;padding:6px 12px;border-radius:7px;font-weight:700;color:var(--muted);cursor:pointer}
.tabs button.on{background:var(--panel);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.08)}

.app{display:grid;grid-template-columns:minmax(360px,440px) 1fr;min-height:calc(100vh - 60px)}
.side{border-right:1px solid var(--line);background:var(--panel);padding-block:14px 80px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:16px;min-width:0}
.view{padding-block:20px 60px;padding-left:20px;padding-right:max(16px,env(safe-area-inset-right,0px));min-width:0}

.intro{font-size:13px;color:var(--muted);line-height:1.5;margin:0 0 12px}
.row-btns{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}

details.sec{border:1px solid var(--line);border-radius:12px;margin-bottom:8px;background:var(--panel)}
details.sec>summary{list-style:none;cursor:pointer;padding:12px 14px;font-weight:800;display:flex;align-items:center;gap:8px}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary::after{content:"+";margin-left:auto;color:var(--muted);font-weight:500;font-size:18px;line-height:1}
details.sec[open]>summary::after{content:"−"}
details.sec>summary small{font-weight:600;color:var(--muted);font-size:12px}
.sec-in{padding:0 14px 14px;display:grid;gap:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.f{display:grid;gap:4px;min-width:0}
.f>span{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.6px}
.f input,.f textarea,.f select{width:100%;background:var(--field);border:1px solid var(--line);border-radius:9px;padding:8px 10px;min-width:0}
.f textarea{min-height:58px;resize:vertical;line-height:1.4}
.f input:focus,.f textarea:focus,.f select:focus{border-color:var(--accent);outline:none}
.item{border:1px solid var(--line);border-radius:10px;padding:10px;display:grid;gap:8px;background:var(--field)}
.item .f input,.item .f textarea,.item .f select{background:var(--panel)}
.item-h{display:flex;align-items:center;gap:6px}
.item-h b{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin-right:auto}
.sub{border-left:3px solid var(--accent);padding-left:10px;display:grid;gap:8px}
.chk{display:flex;align-items:center;gap:8px;font-weight:600}
.chk input{width:18px;height:18px;accent-color:var(--accent)}
.hint{font-size:12px;color:var(--muted);line-height:1.45}
.ex{display:grid;grid-template-columns:96px 1fr;gap:10px;align-items:start}
.thumb{width:96px;height:60px;border-radius:10px;border:1.5px dashed var(--line);display:grid;place-items:center;background:var(--panel);
  overflow:hidden;cursor:pointer;position:relative;font-size:11px;font-weight:700;color:var(--muted);text-align:center;line-height:1.2}
.thumb img{width:100%;height:100%;object-fit:contain;background:#fff}
.thumb input{position:absolute;inset:0;opacity:0;cursor:pointer}
.thumb.has{border-style:solid}
.thumb .lib{position:absolute;left:3px;bottom:3px;background:var(--accent);color:var(--accent-ink);font-size:9px;padding:1px 4px;border-radius:4px}
.libgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
.libcell{border:1px solid var(--line);border-radius:10px;padding:6px;display:grid;gap:4px;background:var(--field)}
.libcell img{width:100%;aspect-ratio:2/1;object-fit:contain;background:#fff;border-radius:6px}
.libcell span{font-size:11px;font-weight:600;line-height:1.25;word-break:break-word}

.pages{display:grid;gap:22px;justify-items:center}
.pbox{position:relative;box-shadow:0 6px 24px rgba(0,0,0,.14);border-radius:2px;overflow:hidden;max-width:100%}
.pbox>.pg{transform-origin:0 0;position:absolute;top:0;left:0}
.pbox.over{outline:3px solid var(--warn)}
.pbox .warn{position:absolute;right:8px;bottom:8px;z-index:5;background:var(--warn);color:#fff;font-size:12px;font-weight:700;padding:4px 8px;border-radius:6px}
.toast{visibility:hidden;position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(140%);background:var(--fg);color:var(--bg);
  padding:10px 16px;border-radius:10px;font-weight:700;z-index:50;transition:transform .25s;max-width:calc(100% - 32px)}
.toast.show{visibility:visible;transform:translateX(-50%) translateY(0)}
#exp{position:fixed;left:-20000px;top:0}
.modal{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.45);display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.modal-in{background:var(--panel);border-radius:16px;width:min(920px,100%);max-height:100%;display:flex;flex-direction:column;overflow:hidden;border:1px solid var(--line)}
.modal-h{display:flex;gap:8px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.modal-h b{font-size:15px;margin-right:auto}
.modal-h input{background:var(--field);border:1px solid var(--line);border-radius:9px;padding:7px 10px;min-width:0;flex:1 1 160px}
.modal-b{overflow:auto;padding:12px 14px 18px}
.modal-b h4{margin:12px 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted)}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
.pcell{border:1px solid var(--line);border-radius:12px;background:var(--field);padding:6px;cursor:pointer;display:grid;gap:4px;text-align:left}
.pcell:hover{border-color:var(--accent)}
.pcell img{width:100%;aspect-ratio:2/1;object-fit:contain;background:#fff;border-radius:8px}
.pcell span{font-size:12px;font-weight:700;line-height:1.25}
@media print{
  @page{size:A4;margin:0}
  html,body{background:#fff!important;margin:0!important;padding:0!important}
  :root{padding:0!important}
  body::before,.top,.app,.toast{display:none!important}
  #exp{position:static!important;left:auto!important}
  #exp .pg{width:210mm;height:296.5mm;page-break-after:always;break-after:page;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  #exp .pg:last-child{page-break-after:auto;break-after:auto}
}

@media (max-width:980px){
  .app{grid-template-columns:1fr}
  .tabs{display:flex}
  .side{border-right:0;padding-right:max(16px,env(safe-area-inset-right,0px))}
  .view{padding-left:max(16px,env(safe-area-inset-left,0px))}
  body[data-tab="edit"] .view{display:none}
  body[data-tab="view"] .side{display:none}
}
@media (max-width:420px){.grid3{grid-template-columns:1fr 1fr}.top .btn.hide-s{display:none}}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}

/* ======= PAGINE A4 (documento, colori fissi) ======= */
.pg{width:794px;height:1123px;background:#FAF8F5;color:#15171B;font-family:var(--doc);font-size:12.5px;line-height:1.45;overflow:hidden;position:relative}
.pg *{box-sizing:border-box}
.pg .band{position:absolute;top:0;left:0;right:0;height:40px;background:#15171B;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 50px;font-size:11px}
.pg .band::before{content:"";position:absolute;left:0;top:0;bottom:0;width:8px;background:var(--ac)}
.pg .band b{font-weight:700;letter-spacing:.4px}
.pg .band span{color:#9AA0A8;text-transform:uppercase;letter-spacing:.6px}
.pg .foot{position:absolute;left:50px;right:50px;bottom:24px;border-top:1px solid #E2DCD3;padding-top:8px;display:flex;justify-content:space-between;font-size:10px;color:#6B6F76}
.pg .body{position:absolute;top:74px;left:50px;right:50px;bottom:62px;overflow:hidden;display:flex;flex-direction:column;gap:14px}
.pg .kick{font-size:11px;font-weight:500;color:var(--ac);text-transform:uppercase;letter-spacing:.6px}
.pg h1{font-size:31px;line-height:1.1;margin:2px 0 0;font-weight:700;letter-spacing:-.3px}
.pg .lead{color:#6B6F76;font-size:13px;margin-top:4px}
.pg h2{font-size:17px;margin:4px 0 0;font-weight:700}
.pg .call{background:#F1EDE7;border-left:4px solid var(--ac);padding:10px 14px;font-size:11.5px}
.pg .call.dark{border-left-color:#15171B;background:#fff}
.pg .call b{font-weight:700}
.pg table{width:100%;border-collapse:collapse}
.pg .card{background:#fff;border:1px solid #E2DCD3}
.pg .muted{color:#6B6F76}

.pg.cover{background:#15171B;color:#fff}
.pg.cover .c1{position:absolute;right:-150px;top:-150px;width:520px;height:520px;border-radius:50%;background:#23262C}
.pg.cover .c2{position:absolute;right:-60px;top:-60px;width:340px;height:340px;border-radius:50%;background:#2C3037}
.pg.cover .rail{position:absolute;left:0;top:0;width:13px;height:330px;background:var(--ac)}
.pg.cover .in{position:absolute;inset:120px 64px 60px 66px;display:flex;flex-direction:column}
.pg.cover .k{color:var(--ac);font-weight:500;font-size:13px;letter-spacing:.6px;text-transform:uppercase}
.pg.cover .t1{font-weight:700;font-size:60px;line-height:1.02;margin-top:16px;letter-spacing:-.5px}
.pg.cover .t2{font-weight:300;font-size:60px;line-height:1.02;letter-spacing:-.5px}
.pg.cover .who{color:#B8BDC4;font-size:17px;margin-top:18px}
.pg.cover .tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:48px}
.pg.cover .tile{background:#23262C;border-radius:14px;padding:16px 16px 14px}
.pg.cover .tile b{display:block;font-size:26px;line-height:1.1;font-weight:700}
.pg.cover .tile b.hl{color:var(--ac)}
.pg.cover .tile span{font-size:11px;color:#9AA0A8}
.pg.cover .kcal{margin-top:46px}
.pg.cover .kcal h3{font-size:18px;margin:0 0 6px;font-weight:700}
.pg.cover .kcal .n{font-size:44px;font-weight:700;color:var(--ac);line-height:1}
.pg.cover .kcal .n small{font-size:15px;color:#B8BDC4;font-weight:400;margin-left:8px}
.pg.cover .bar{display:flex;height:15px;margin-top:16px;gap:3px}
.pg.cover .legend{display:flex;margin-top:10px}
.pg.cover .legend div{font-size:17px;font-weight:700}
.pg.cover .legend span{display:block;font-size:11px;color:#9AA0A8;font-weight:400}
.pg.cover .toc{margin-top:auto}
.pg.cover .toc h4{font-size:14px;margin:0 0 10px}
.pg.cover .toc ol{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:1fr 1fr;gap:6px 30px;color:#C9CDD3;font-size:12.5px}
.pg.cover .coach{margin-top:26px;font-size:11px;color:#7D838B;border-top:3px solid var(--ac);padding-top:10px;width:max-content}

.pg .week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.pg .day{background:#F1EDE7;padding:10px 8px;min-height:104px}
.pg .day.on{background:#fff;border-top:4px solid var(--ac)}
.pg .day b{font-size:10px;color:#6B6F76;letter-spacing:.5px}
.pg .day.on b{color:var(--ac)}
.pg .day h5{margin:6px 0 2px;font-size:11.5px;line-height:1.25}
.pg .day:not(.on) h5{color:#6B6F76}
.pg .day p{margin:0;font-size:9.5px;color:#6B6F76;line-height:1.3}
.pg .meth{display:grid;grid-template-columns:1fr 1fr;border:1px solid #E2DCD3;background:#fff}
.pg .meth div{padding:13px 15px;border-bottom:1px solid #E2DCD3;border-right:1px solid #E2DCD3}
.pg .meth div:nth-child(2n){border-right:0}
.pg .meth h6{margin:0 0 3px;font-size:12.5px;color:var(--ac);text-transform:uppercase}
.pg .meth p{margin:0;font-size:11px}

.pg .ses th{background:#15171B;color:#fff;font-size:9px;font-weight:700;padding:8px 6px;text-transform:uppercase;letter-spacing:.4px;text-align:center;border-bottom:3px solid var(--ac)}
.pg .ses th.l{text-align:left}
.pg .ses td{border-bottom:1px solid #E2DCD3;padding:8px 6px;vertical-align:middle;text-align:center;font-size:11px}
.pg .ses tr:nth-child(even) td.z{background:#F1EDE7}
.pg .ses td.l{text-align:left}
.pg .ses td.kg{background:#fff;border-left:1px solid #E2DCD3;vertical-align:bottom;color:#B8B2A8;font-size:9px;width:46px}
.pg .ses .num{font-weight:700;font-size:13px;color:var(--ac)}
.pg .ses .img{width:150px;height:75px;border-radius:8px;background:#fff;border:1px solid #E2DCD3;object-fit:contain;display:block;margin:0 auto}
.pg .ses .nm{font-weight:700;font-size:12px;line-height:1.25}
.pg .ses .nt{color:#6B6F76;font-size:10px;line-height:1.3;margin-top:2px}
.pg .ses .st{font-weight:500;font-size:10.5px;line-height:1.3}

.pg .blk{background:#fff;border-top:4px solid var(--ac)}
.pg .blk h6{margin:0;padding:10px 14px 4px;font-size:11px;color:var(--ac);text-transform:uppercase;letter-spacing:.4px}
.pg .blk table td{padding:8px 14px;border-bottom:1px solid #E2DCD3;font-size:11.5px;vertical-align:middle}
.pg .blk table tr:last-child td{border-bottom:0}
.pg .blk td.a{font-weight:700;font-size:13px;width:110px}

.pg .macro{display:grid;grid-template-columns:repeat(5,1fr);background:#fff;border:1px solid #E2DCD3}
.pg .macro div{padding:12px 14px;border-right:1px solid #E2DCD3}
.pg .macro div:last-child{border-right:0}
.pg .macro b{display:block;font-size:24px;line-height:1.1}
.pg .macro span{font-size:10.5px;color:#6B6F76}
.pg .meal{background:#fff;border-left:4px solid #1E9E6A}
.pg .meal .mh{padding:9px 14px 7px;border-bottom:1px solid #E2DCD3}
.pg .meal .mh small{display:block;font-size:9.5px;font-weight:700;color:#1E9E6A;text-transform:uppercase}
.pg .meal .mh b{font-size:14px}
.pg .meal td{padding:6px 14px;border-bottom:1px solid #E2DCD3;font-size:11px;vertical-align:middle}
.pg .meal tr:last-child td{border-bottom:0}
.pg .meal td.tg{width:96px;font-size:9.5px;font-weight:700;text-transform:uppercase}
.pg .list td{padding:7px 0;border-bottom:1px solid #E2DCD3;font-size:11.5px;vertical-align:top}
.pg .list tr:last-child td{border-bottom:0}
.pg .list td.a{font-weight:700;width:110px}
.pg .list td.n{color:#1E9E6A;font-weight:700;width:30px}

.pg .shop table{background:#fff}
.pg .shop th{font-size:9px;color:#fff;text-transform:uppercase;padding:7px 12px;text-align:left;font-weight:700}
.pg .shop th.r,.pg .shop td.r{text-align:right}
.pg .shop td{padding:6px 12px;border-bottom:1px solid #E2DCD3;font-size:11.5px}
.pg .shop tr:last-child td{border-bottom:0}
.pg .shop td.nm{font-weight:500}
.pg .shop .box{display:inline-block;width:11px;height:11px;border:1.5px solid #B0A89C;border-radius:2px;margin-right:9px;vertical-align:-1px}
.pg .tot{background:#15171B;color:#fff;display:flex;justify-content:space-between;align-items:center;padding:12px 16px;font-weight:700}
.pg .tot b{color:var(--ac);font-size:20px}
.pg .prog th{background:#15171B;color:#fff;font-size:9px;text-transform:uppercase;padding:7px 9px;text-align:left;border-bottom:3px solid var(--ac)}
.pg .prog td{border:1px solid #E2DCD3;background:#fff;height:44px;padding:0 9px;font-size:11.5px}
.pg .prog td.m{font-weight:700}
.pg .prog td.t{color:#6B6F76}
</style>

<header class="top">
  <div class="brand"><i></i>Schede Coaching</div>
  <div class="tabs" role="tablist">
    <button type="button" id="tabEdit" class="on" data-tab="edit">Modifica</button>
    <button type="button" id="tabView" data-tab="view">Anteprima</button>
  </div>
  <button type="button" class="btn pri" id="btnPdf">Scarica PDF</button>
</header>

<div class="app">
  <aside class="side">
    <p class="intro">Compila i campi: l'anteprima si aggiorna da sola. Le immagini degli esercizi restano salvate nella libreria e tornano in automatico quando riassegni lo stesso esercizio.</p>
    <div class="row-btns">
      <button type="button" class="btn sm" id="btnNew">Nuovo cliente (vuoto)</button>
      <button type="button" class="btn sm" id="btnSample">Carica esempio</button>
      <button type="button" class="btn sm" id="btnBackup">Salva backup</button>
      <label class="btn sm" for="openBackup" style="position:relative">Apri backup<input type="file" id="openBackup" accept=".json,application/json" style="position:absolute;inset:0;opacity:0;width:100%;cursor:pointer"></label>
    </div>
    <div id="form"></div>
  </aside>
  <main class="view">
    <div class="pages" id="pages"></div>
  </main>
</div>
<div id="exp"></div>
<div class="modal" id="picker" hidden role="dialog" aria-modal="true" aria-labelledby="pickTitle">
  <div class="modal-in">
    <div class="modal-h"><b id="pickTitle">Catalogo esercizi</b><input type="search" id="pickQ" placeholder="Cerca esercizio" aria-label="Cerca esercizio"><button type="button" class="btn sm" id="pickClose">Chiudi</button></div>
    <div class="modal-b" id="pickGrid"></div>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* Manichino 3D in SVG: pose ad angoli (0 = avanti/destra, 90 = giù, -90 = su, 180 = indietro) */
const MANN = (() => {
  const L = { torso: 56, neck: 7, ua: 29, fa: 26, th: 41, sh: 39, ft: 12, head: 11.5 };
  const W = { torso: 27, pelvis: 23, ua: 12.5, fa: 10.5, th: 17, sh: 13, ft: 8 };
  const C = {
    near: ["#A7ACB3", "#CDD1D6", "#EEF0F2"],
    far: ["#8C9198", "#AEB2B8", "#C9CCD1"],
    hl: ["#D9561A", "#F2843F", "#FFC59C"],
    hlFar: ["#B9481A", "#D9703A", "#EFA57A"],
    eq: "#2E3136", eq2: "#4A4E55", eq3: "#6B7078", cable: "#5B6068"

let S, LIB={};
function load(){
  try{const x=localStorage.getItem(KEY); S=x?JSON.parse(x):sample();}catch(e){S=sample();}
  try{LIB=JSON.parse(localStorage.getItem(LIBKEY)||"{}")||{};}catch(e){LIB={};}
}
let saveT;
function persist(){
  clearTimeout(saveT);
  saveT=setTimeout(()=>{
    try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}
    try{localStorage.setItem(LIBKEY,JSON.stringify(LIB));}catch(e){toast("Memoria del browser piena: salva un backup.");}
  },400);
}
const norm=s=>String(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]+/g," ").trim();
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const nl=s=>esc(s).replace(/\n/g,"<br>");
function getP(p){return p.split(".").reduce((o,k)=>o==null?o:o[k],S);}
function setP(p,v){const ks=p.split(".");const last=ks.pop();const o=ks.reduce((o,k)=>o[k],S);o[last]=v;}
const BUILTIN={},BUILTIN_NAMES={};
CATALOG.forEach(c=>{try{const k=norm(c.nome);BUILTIN[k]="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(MANN.render(c.d,c.d2));BUILTIN_NAMES[k]=c.nome;}catch(e){}});
function exImg(e){const k=norm(e.nome);return e.img||LIB[k]||BUILTIN[k]||"";}
function imgSrc(e){const k=norm(e.nome);return e.img?"custom":LIB[k]?"lib":BUILTIN[k]?"cat":"";}

function ta(p,label,ph=""){return `<label class="f" for="${id(p)}"><span>${label}</span><textarea id="${id(p)}" data-p="${p}" placeholder="${esc(ph)}">${esc(getP(p))}</textarea></label>`;}
function sel(p,label,opts){const v=getP(p);return `<label class="f" for="${id(p)}"><span>${label}</span><select id="${id(p)}" data-p="${p}">${opts.map(o=>{const [val,txt]=Array.isArray(o)?o:[o,o];return `<option value="${esc(val)}"${val===v?" selected":""}>${esc(txt)}</option>`}).join("")}</select></label>`;}
function ctl(p,i,n,label){return `<div class="item-h"><b>${label}</b>

function sec(key,title,sub,inner){return `<details class="sec" data-k="${key}"${OPEN.has(key)?" open":""}><summary>${title}${sub?` <small>${sub}</small>`:""}</summary><div class="sec-in">${inner}</div></details>`;}

  if(sz.alimentazione){
    P.push(page("Alimentazione",`${head("Alimentazione","Il piano alimentare","Scegli un alimento per ogni riga di ogni pasto, rispettando le grammature. Tutto pesato a crudo.")}
      ${has(m.kcal)?`<div class="macro"><div><b>${esc(m.kcal)}</b><span>kcal al giorno</span></div><div><b style="color:#2F6FDE">${esc(m.carbo)} g</b><span>carboidrati</span></div><div><b style="color:${esc(S.colore)}">${esc(m.prot)} g</b><span>proteine</span></div><div><b style="color:#D9A300">${esc(m.grassi)} g</b><span>grassi</span></div><div><b style="color:#1E9E6A">${esc(m.acqua)} L</b><span>acqua${has(m.sale)?" · "+esc(m.sale)+" g sale":""}</span></div></div>`:""}
      ${S.pasti.map((p,i)=>`<div class="meal"><div class="mh"><small>Pasto ${i+1}</small><b>${esc(p.nome)}</b></div><table>${p.righe.map(r=>`<tr><td class="tg" style="color:${TAGCOL[r.tag]||"#6B6F76"}">${esc(r.tag)}</td><td>${esc(r.testo)||"&nbsp;"}</td></tr>`).join("")}</table></div>`).join("")}`));
  }
  if(sz.giornata){
    P.push(page("Alimentazione",`${head("Alimentazione","Una giornata tipo","Un esempio già composto seguendo il piano.")}
      <div class="card" style="padding:4px 14px"><table class="list">${S.giornata.map(g=>`<tr><td class="a">${esc(g.a)}</td><td>${esc(g.b)||"&nbsp;"}</td></tr>`).join("")}</table></div>
      ${S.regole.filter(has).length?`<h2>Le regole</h2><table class="list">${S.regole.filter(has).map((r,i)=>`<tr><td class="n">${String(i+1).padStart(2,"0")}</td><td>${esc(r)}</td></tr>`).join("")}</table>`:""}
      ${has(S.integratori)?`<div class="call" style="border-left-color:#1E9E6A"><b>Integratori:</b> ${esc(S.integratori)}</div>`:""}`));
  }
  if(sz.spesa){
    let tot=0;
    const cats=S.spesa.categorie.map((c,i)=>{const col=SHOPCOL[i%SHOPCOL.length];return `<table><thead><tr style="background:${col}"><th>${esc(c.nome)}</th><th>Quantità</th><th>Per</th><th class="r">€ circa</th></tr></thead><tbody>${c.items.map(it=>{tot+=num(it.prezzo);return `<tr><td class="nm"><span class="box"></span>${esc(it.nome)||"&nbsp;"}</td><td>${esc(it.q)}</td><td class="muted">${esc(it.per)}</td><td class="r">${has(it.prezzo)?fmt(num(it.prezzo)):""}</td></tr>`}).join("")}</tbody></table>`}).join("");
    P.push(page("Lista della spesa",`${head("Spesa","Lista della spesa","Spesa per 7 giorni costruita sul piano.")}<div class="shop" style="display:grid;gap:10px">${cats}</div>
      ${tot>0?`<div class="tot"><span>TOTALE SETTIMANALE STIMATO</span><b>≈ ${Math.round(tot)} €</b></div>`:""}
      ${has(S.spesa.nota)?`<div class="call">${esc(S.spesa.nota)}</div>`:""}`));
  }
  if(sz.progressi){
    const n=Math.max(1,Math.min(18,parseInt(S.progressi.mesi)||12)),p0=num(S.progressi.peso),dv=num(S.progressi.variazione);
    const rows=Array.from({length:n},(_,i)=>`<tr><td class="m">Mese ${i+1}</td><td></td><td></td><td class="t">${p0&&dv?fmt(p0+dv*(i+1)/n).replace(/,?0+$/,"").replace(/,$/,""):""}</td><td></td><td></td></tr>`).join("");
    P.push(page("Diario dei progressi",`${head("Progressi","Diario dei progressi",S.progressi.nota)}
      <table class="prog"><thead><tr><th style="width:84px">Mese</th><th style="width:90px">Data</th><th style="width:96px">Peso (kg)</th><th style="width:96px">Obiettivo</th><th style="width:96px">Vita (cm)</th><th>Note</th></tr></thead><tbody>${rows}</tbody></table>`));
  }
  return P;
}

/* ---------- anteprima ---------- */
let renderT;
function schedule(){clearTimeout(renderT);renderT=setTimeout(renderPreview,120);persist();}
function renderPreview(){
  const P=buildPages(),wrap=document.getElementById("pages");
  const w=Math.max(260,wrap.clientWidth||794);
  const sc=Math.min(1,w/794);
  wrap.innerHTML=P.map((p,i)=>`<div class="pbox" style="width:${794*sc}px;height:${1123*sc}px">${p.html(i+1,P.length).replace('class="pg','style="transform:scale('+sc+')" class="pg')}</div>`).join("");
  wrap.querySelectorAll(".pbox").forEach(b=>{const body=b.querySelector(".body");if(body&&body.scrollHeight>body.clientHeight+2){b.classList.add("over");b.insertAdjacentHTML("beforeend",'<div class="warn">Pagina troppo piena: accorcia i testi o dividi la sessione</div>');}});
}

/* ---------- eventi ---------- */
const form=document.getElementById("form");
form.addEventListener("input",e=>{
  const p=e.target.dataset.p;if(!p)return;
  setP(p,e.target.type==="checkbox"?e.target.checked:e.target.value);
  if(p==="colore")document.documentElement.style.setProperty("--accent",e.target.value);
  schedule();
});
form.addEventListener("change",e=>{
  const p=e.target.dataset.p;
  if(p&&/esercizi\.\d+\.nome$/.test(p)){renderForm();schedule();}
  const ip=e.target.dataset.img;if(ip&&e.target.files[0])loadImg(ip,e.target.files[0]);
});
form.addEventListener("toggle",e=>{const d=e.target;if(d.dataset&&d.dataset.k){d.open?OPEN.add(d.dataset.k):OPEN.delete(d.dataset.k);}},true);
function tmpl(p){
  if(p==="sessioni")return {titolo:"Sessione "+(S.sessioni.length+1),focus:"",prima:"",dopo:"",esercizi:[blankEx()]};
  if(/esercizi$/.test(p))return blankEx();
  if(p==="metodo")return {t:"",d:""};
  if(p==="contorno")return {titolo:"",righe:[{a:"",b:""}]};
  if(/^contorno\.\d+\.righe$/.test(p))return {a:"",b:""};
  if(p==="pasti")return {nome:"",righe:[{tag:"Proteine",testo:""}]};
  if(/^pasti\.\d+\.righe$/.test(p))return {tag:"Carboidrati",testo:""};
  if(p==="giornata")return {a:"",b:""};
  if(p==="regole")return "";
  if(p==="spesa.categorie")return {nome:"",items:[{nome:"",q:"",per:"",prezzo:""}]};
  if(/items$/.test(p))return {nome:"",q:"",per:"",prezzo:""};
  return "";
}
form.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]");if(!b)return;
  const a=b.dataset.act,p=b.dataset.p,i=+b.dataset.i;
  if(a==="pick"){openPicker(p);return;}
  if(a==="libdel"){delete LIB[b.dataset.k];delete LIB_NAMES[b.dataset.k];}
  else if(a==="noimg"){getP(p).img="";}
  else{const arr=getP(p);
    if(a==="add")arr.push(tmpl(p));
    if(a==="del")arr.splice(i,1);
    if(a==="up"&&i>0)[arr[i-1],arr[i]]=[arr[i],arr[i-1]];
    if(a==="down"&&i<arr.length-1)[arr[i+1],arr[i]]=[arr[i],arr[i+1]];}
  const y=window.scrollY;renderForm();window.scrollTo(0,y);schedule();
});
function loadImg(p,file){
  const fr=new FileReader();
  fr.onload=()=>{const im=new Image();im.onload=()=>{
    const M=420,r=Math.min(1,M/Math.max(im.width,im.height)),c=document.createElement("canvas");
    c.width=Math.round(im.width*r);c.height=Math.round(im.height*r);
    const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);
    const url=c.toDataURL("image/jpeg",0.86),ex=getP(p);ex.img=url;
    const k=norm(ex.nome);if(k){LIB[k]=url;LIB_NAMES[k]=ex.nome;ex.img="";}
    renderForm();schedule();toast(k?"Immagine salvata in libreria":"Immagine aggiunta");
  };im.src=fr.result;};
  fr.readAsDataURL(file);
}

/* tabs */
function setTab(t){document.body.dataset.tab=t;document.getElementById("tabEdit").classList.toggle("on",t==="edit");document.getElementById("tabView").classList.toggle("on",t==="view");if(t==="view")renderPreview();}
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>setTab(b.dataset.tab));
document.body.dataset.tab="edit";

/* conferme a due tocchi */
function twoTap(btn,label,fn){let armed=false,t;btn.addEventListener("click",()=>{if(armed){clearTimeout(t);armed=false;btn.textContent=label;fn();return;}armed=true;btn.textContent="Sicuro? Tocca di nuovo";t=setTimeout(()=>{armed=false;btn.textContent=label;},3000);});}
twoTap(document.getElementById("btnNew"),"Nuovo cliente (vuoto)",()=>{S=blank(S);renderForm();schedule();toast("Scheda vuota pronta");});
twoTap(document.getElementById("btnSample"),"Carica esempio",()=>{S=sample();renderForm();schedule();toast("Esempio caricato");});

/* download */
let DL=null;
try{window.__host?.use?.("downloads").then(x=>{DL=x;}).catch(()=>{});}catch(e){}
async function offer(filename,blob,fallback){
  if(DL){try{await DL.save({filename,data:blob});toast("File salvato");}catch(err){toast(err&&err.code==="declined"?"Download annullato":"Download non disponibile qui");}return;}
  if(fallback){fallback();toast("File scaricato");return;}
  try{const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=filename;document.body.appendChild(a);a.click();a.remove();toast("File scaricato");}catch(e){toast("Download non disponibile qui");}
}
const fname=s=>(String(s||"cliente").normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^A-Za-z0-9]+/g,"_").replace(/^_|_$/g,"")||"cliente");
document.getElementById("btnBackup").onclick=()=>{
  const blob=new Blob([JSON.stringify({v:1,scheda:S,libreria:LIB,nomi:LIB_NAMES})],{type:"application/json"});
  offer(`Backup_${fname(S.cliente.nome)}.json`,blob);
};
document.getElementById("openBackup").addEventListener("change",e=>{
  const f=e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);if(d.scheda){S=Object.assign(blank(),d.scheda);}if(d.libreria)Object.assign(LIB,d.libreria);if(d.nomi)Object.assign(LIB_NAMES,d.nomi);renderForm();schedule();toast("Backup aperto");}catch(err){toast("File non valido: scegli un backup .json salvato da qui");}e.target.value="";};
  r.readAsText(f);
});
async function loadLibs(){}
function printPdf(){
  const P=buildPages(),exp=document.getElementById("exp");
  exp.innerHTML=P.map((p,i)=>p.html(i+1,P.length)).join("");
  const old=document.title;document.title=`Programma_${fname(S.cliente.nome)}`;
  const done=()=>{exp.innerHTML="";document.title=old;window.removeEventListener("afterprint",done);};
  window.addEventListener("afterprint",done);
  setTimeout(()=>{window.print();},60);
}
const IN_HOST=!!(window.__host&&window.__host.use);
document.getElementById("btnPdf").onclick=async()=>{
  const btn=document.getElementById("btnPdf");
  if(!IN_HOST){toast("Nella finestra di stampa scegli \"Salva come PDF\"");printPdf();return;}
  if(!DL){toast("Download non disponibile qui: apri il file dell'editor nel browser");return;}
  try{await loadLibs();}catch(e){toast("Connessione assente: riprova tra poco");return;}
  btn.disabled=true;
  try{
    try{await document.fonts.ready;}catch(e){}
    const P=buildPages(),exp=document.getElementById("exp");
    exp.innerHTML=P.map((p,i)=>p.html(i+1,P.length)).join("");
    const {jsPDF}=window.jspdf;const doc=new jsPDF({unit:"mm",format:"a4",compress:true});
    const els=exp.querySelectorAll(".pg");
    for(let i=0;i<els.length;i++){
      btn.textContent=`Creo pagina ${i+1}/${els.length}…`;
      const cv=await html2canvas(els[i],{scale:2,backgroundColor:null,useCORS:true,logging:false,width:794,height:1123,windowWidth:794});
      if(i)doc.addPage();
      doc.addImage(cv.toDataURL("image/jpeg",0.9),"JPEG",0,0,210,297,undefined,"FAST");
    }
    exp.innerHTML="";
    const name=`Programma_${fname(S.cliente.nome)}.pdf`;
    await offer(name,doc.output("blob"),DL?null:()=>doc.save(name));
  }catch(err){toast("Errore nella creazione del PDF, riprova");}
  btn.disabled=false;btn.textContent="Scarica PDF";
};

let PICK=null;
function drawPicker(){
  const q=norm(document.getElementById("pickQ").value);
  const groups={};
  CATALOG.forEach(c=>{if(q&&!norm(c.nome).includes(q))return;(groups[c.gruppo]=groups[c.gruppo]||[]).push(c);});
  Object.keys(LIB).forEach(k=>{if(BUILTIN[k])return;const n=LIB_NAMES[k]||k;if(q&&!k.includes(q))return;(groups["Le tue immagini"]=groups["Le tue immagini"]||[]).push({nome:n,mine:k});});
  const html=Object.keys(groups).map(g=>`<h4>${esc(g)}</h4><div class="pgrid">${groups[g].map(c=>`<button type="button" class="pcell" data-name="${esc(c.nome)}"><img src="${c.mine?LIB[c.mine]:(LIB[norm(c.nome)]||BUILTIN[norm(c.nome)])}" alt=""><span>${esc(c.nome)}</span></button>`).join("")}</div>`).join("");
  document.getElementById("pickGrid").innerHTML=html||'<p class="hint">Nessun esercizio trovato. Scrivi il nome a mano e carica la tua immagine con "+ foto".</p>';
}
function openPicker(p){PICK=p;const m=document.getElementById("picker");document.getElementById("pickQ").value="";drawPicker();m.hidden=false;setTimeout(()=>document.getElementById("pickQ").focus(),30);}
function closePicker(){document.getElementById("picker").hidden=true;PICK=null;}
document.getElementById("pickQ").addEventListener("input",drawPicker);
document.getElementById("pickClose").onclick=closePicker;
document.getElementById("picker").addEventListener("click",e=>{
  if(e.target.id==="picker"){closePicker();return;}
  const c=e.target.closest(".pcell");if(!c||!PICK)return;
  const ex=getP(PICK);ex.nome=c.dataset.name;ex.img="";
  closePicker();const y=window.scrollY;renderForm();window.scrollTo(0,y);schedule();toast("Esercizio inserito");
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&PICK)closePicker();});
let tt;function toast(m){const t=document.getElementById("toast");t.textContent=m;t.classList.add("show");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("show"),2600);}
window.addEventListener("resize",()=>{clearTimeout(renderT);renderT=setTimeout(renderPreview,150);});

/* avvio */
load();
try{LIB_NAMES=JSON.parse(localStorage.getItem(LIBKEY+"-n")||"{}")||{};}catch(e){LIB_NAMES={};}
const _persist=persist;
persist=function(){_persist();setTimeout(()=>{try{localStorage.setItem(LIBKEY+"-n",JSON.stringify(LIB_NAMES));}catch(e){}},420);};
document.documentElement.style.setProperty("--accent",S.colore);
renderForm();renderPreview();
</script>
